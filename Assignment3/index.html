<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f2f2f2;
        }

        .container{
            width:500px;
            margin:40px auto;
            background:white;
            padding:20px;
            border:1px solid gray;
        }

        input,
        select,
        textarea{
            width:100%;
            padding:10px;
            margin:8px 0;
            box-sizing:border-box;
        }

        button{
            padding:10px;
            margin:5px;
        }

        .error{
            color:red;
            font-size:14px;
        }

        #output{
            margin-top:15px;
            padding:10px;
            border:1px solid gray;
        }

        #sessionUser{
            margin-top:10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Feedback Form</h2>

    <form id="feedbackForm">

        <label>Student Name</label>
        <input type="text" id="name">
        <div class="error" id="nameError"></div>

        <label>Email</label>
        <input type="email" id="email">
        <div class="error" id="emailError"></div>

        <label>Course</label>
        <select id="course">
            <option value="">Select Course</option>
            <option>Cpp</option>
            <option>Java</option>
            <option>Dbms</option>
            <option>Python</option>
        </select>
        <div class="error" id="courseError"></div>

        <label>Feedback</label>
        <textarea id="feedback" rows="5"></textarea>
        <div class="error" id="feedbackError"></div>

        <button type="submit">Submit Feedback</button>
        <button type="button" onclick="deleteData()">Delete Stored Data</button>

    </form>

    <hr>
    <h3>Stored Feedback</h3>
    <h3 id="sessionUser"></h3>
    <div id="output">No feedback stored.</div>


</div>

<script src="script.js"></script>

</body>
</html>
